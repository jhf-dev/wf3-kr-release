name: release-contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate immutable release contract
        shell: pwsh
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ("${env:GITHUB_EVENT_NAME}" -eq "pull_request") {
            if ("${env:PR_AUTHOR}" -ne "jhf-dev") {
              throw "Release pull requests must be opened by jhf-dev."
            }
            python .release/validate_release.py --root . --base-ref "origin/${env:BASE_REF}"
          } else {
            python .release/validate_release.py --root .
          }
